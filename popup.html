<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ShopScope</title>
    <style>
      body{width:240px;margin:0;padding:16px;background:#fff;color:#202522;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}
      h1{margin:0 0 6px;font-size:18px;color:#146b55}p{margin:0 0 14px;color:#66716b;font-size:12px}

      #message{min-height:16px;margin-top:9px;font-size:12px;color:#a64030}

  </head>
  <body>
    <h1>ShopScope</h1>
    <p>在 Temu 商品主图上点击搜图按钮，查看 1688 相似货源。</p>

    <div id="message" role="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
